<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MobilityMetric</title>
  <meta name="description" content="Live, map-based demos of open mobility datasets: signalized intersections, low-emission zones, and EV charging.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f14; color: #e6edf3; text-align: center; padding: 24px;
    }
    .wrap { max-width: 560px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #3fb950; display: inline-block; margin-right: 8px; vertical-align: middle; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    p { color: #9aa7b4; line-height: 1.6; margin: 0 auto 10px; }
    .tag { font-size: 0.85rem; color: #6e7b88; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MobilityMetric</h1>
    <p><span class="dot"></span>Live demos coming soon.</p>
    <p>Map-based previews of open mobility datasets — signalized intersections, low-emission zones, and EV charging.</p>
    <p class="tag">Data © OpenStreetMap contributors, ODbL 1.0</p>
  </div>
</body>
</html>
